<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
        }

        .img {
            position: relative;
        }

        .text {
            position: absolute;
            top: 170px;
            right: 50px;
        }
        .unique{
            height: 150px;
            border: 1px solid red;
            width: 300px;
            text-align: center;
            padding-top: 5px;
        }
        .content{
            display: flex;
            justify-content: space-evenly;
        }
        .box{
            margin: 20px;
        }
    </style>

</head>

<body>
    <div class="box">
        <header>
            <img src="./unnamed.png" alt="Cannot load Logo" style="height: 100px; width: 100px;">
            <nav>
                <a href="">Home</a>
                <a href="">About</a>
                <a href="">Service</a>
                <a href="">My Work</a>
                <a href="">Contact</a>
            </nav>
        </header>
        <div class="above">
            <div class="img"><img src="./images.jpg" alt="Cannot load image" style="height: 600px; width: 100%;"></div>
            <div class="text">
                <h3>Hello, I'm Wed devloper</h3>
                <p>I use CSS and HTML to convert webpage design into beautiful and efficient website</p>
            </div>
        </div>
        <div class="below">
            <div class="content">
                <div class="unique">Program 1</div>
                <div class="unique">Program 2</div>
                <div class="unique">Program 3</div>
                <div class="unique">Program 4</div>
            </div>
        </div>
    </div>
</body>

</html>
