<html>

<head>
    <title>
        Table Layout
    </title>
    <style>
        .entry {
            background-color: black;
            color: white;
            margin: 10px;
            padding: 10px;
            width: 600px;

        }

        header {
            padding: 10px;
            color: white;
            background-color: purple;
        }

        .sidebar {
            background-color: black;
            color: white;
            padding: 5px;
            height: 100px;
            width: 300px;
            margin: 10px;
        }

        .content {
            margin-left: 10px;
        }

        footer {
            background-color: blue;
            color: white;
        }

        .main {
            background-color: orange;
            display: flex;
            justify-content: space-between;
        }
        .entries{
            margin-bottom: 45px;
        }
        body {
            background-color: aqua;
        }
    </style>
</head>

<body>
    <div>
        <span>Page</span>
        <div class="group">
            <header>Header</header>
            <div class="main">
                <div class="entries">
                    <div class="entry">Entry</div>
                    <div class="entry">Entry</div>
                    <div class="entry">Entry</div>
                </div>
                <div class="sidebar">Sidebar</div>
            </div>
        </div>
        <footer>Darshan university-Rajkot</footer>
    </div>
</body>

</html>
