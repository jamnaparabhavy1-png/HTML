<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .ball{
            height: 100px;
            width: 100px;
            border-radius: 100px;
            background-color: red;
            animation-name: ball;
            animation-timing-function: ease;
            animation-delay: 1s;
            animation-duration: 10s;
            animation-iteration-count: infinite;
            position: relative;
        }
        body {
            border: 1px solid black;
            height: 700px;
            width: 100%;

        }
        @keyframes ball {
            0%{
                top: 0px;
                left: 0px;
                background-color: red;
            }
            10%{
                top: 600px;
                left: 150px;
                background-color: aqua;
            }
            20%{
                top: 150px;
                left: 300px;
                background-color: blue;
            }
            30%{
                top: 600px;
                left: 450px;
                background-color: blueviolet;
            }
            40%{
                top: 300px;
                left: 600px;
                background-color: brown;
            }
            50%{
                top: 600px;
                left: 750px;
                background-color: chartreuse;
            }
            60%{
                top: 450px;
                left: 900px;
                background-color: chocolate;
            }
            70%{
                top: 600px;
                left: 1050px;
                background-color: cyan;
            }
            80%{
                top: 600px;
                left: 1200px;
                background-color: red;
            }
            
        }
    </style>
</head>
<body>
    <div class="ball"></div>
</body>
</html>
